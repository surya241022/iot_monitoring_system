services:
  telemetry-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: telemetry-api
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  telemetry-collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: telemetry-collector
    env_file:
      - .env
    environment:
      API_BASE_URL: "http://telemetry-api:8000"
    depends_on:
      telemetry-api:
        condition: service_healthy
    volumes:
      - ./local_s3_output:/app/local_s3_output
